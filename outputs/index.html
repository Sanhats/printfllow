<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20231f"><title>PrintFlow</title>
<style>
:root{--ink:#20231f;--muted:#7b8076;--line:#e2e4dc;--olive:#66704a;--paper:#f6f7f3;--white:#fff;--ok:#71805b;--danger:#a45e55}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:28px 22px 48px}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.logo{font-size:20px;font-weight:850}.logo em{color:var(--olive);font-style:normal}.connection{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.led{width:8px;height:8px;border-radius:50%;background:#b6b9b0}.led.on{background:var(--ok);box-shadow:0 0 0 4px #e0e7d8}.intro small{color:var(--olive);font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.intro h1{font-size:34px;letter-spacing:-1.7px;margin:8px 0}.intro p{color:var(--muted);margin:0 0 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 30px #20231f0b}.drop{min-height:225px;border:1.5px dashed #b9bfaa;border-radius:15px;background:#fbfcfa;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.2s}.drop:hover{border-color:var(--olive);background:#f1f4ea;transform:translateY(-1px)}.icon{width:52px;height:52px;display:grid;place-items:center;background:#e9eddf;border-radius:16px;font-size:25px;margin-bottom:14px}.drop strong{font-size:16px}.drop span{color:var(--muted);font-size:13px;margin-top:7px}.drop input{display:none}.selected{display:none;align-items:center;gap:12px;padding:14px;background:#f1f3ed;border-radius:12px}.selected.show{display:flex;animation:pop .25s ease}.selected .doc{font-size:21px}.meta{min-width:0;flex:1}.meta b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta small{color:var(--muted)}.remove{border:0;background:none;color:var(--muted);font-size:23px}.controls{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-top:19px}.label{color:var(--muted);font-size:12px;font-weight:700;display:block;margin-bottom:8px}.counter{display:flex;gap:8px}.counter button,.counter input{width:40px;height:40px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:center}.counter button{font-size:20px}.send{border:0;border-radius:10px;background:var(--olive);color:#fff;font-weight:800;padding:0 22px;height:44px;cursor:pointer;transition:.2s;box-shadow:0 5px 14px #66704a30}.send:hover{background:#4f5938;transform:translateY(-1px)}.send:disabled{opacity:.4;cursor:not-allowed;transform:none}.progress{display:none;margin-top:18px}.progress.show{display:block}.track{height:4px;background:#e9ece3;overflow:hidden;border-radius:8px}.track i{display:block;width:35%;height:100%;background:var(--olive);animation:load 1.3s infinite}.result{display:none;gap:10px;align-items:center;margin-top:18px;padding:13px;border-radius:11px;font-size:13px}.result.show{display:flex;animation:pop .3s}.result.ok{background:#edf2e7;color:#50603c}.result.error{background:#f8ecea;color:var(--danger)}.check{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:currentColor;color:#fff}.secondary{margin-top:30px}.secondary summary{cursor:pointer;color:var(--muted);font-weight:750;font-size:13px}.settings{display:grid;gap:11px;margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}.setting{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}.setting input,.setting select{max-width:190px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.save{border:0;border-radius:8px;background:var(--ink);color:#fff;padding:10px;font-size:12px;font-weight:750}.recent{margin-top:30px}.recent-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.recent h2{font-size:17px;margin:0}.recent-head small{color:var(--muted);font-size:11px}.jobs{display:grid;gap:8px}.job{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);padding:12px;border-radius:12px;animation:pop .3s}.job-icon{width:30px;height:30px;border-radius:9px;background:#eef0e9;display:grid;place-items:center}.job-main{min-width:0;flex:1}.job-main b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.job-main small{color:var(--muted);font-size:11px}.pill{font-size:10px;font-weight:800;border-radius:20px;padding:5px 8px;background:#eeeade;color:#82713f}.pill.done{background:#e6edde;color:#5b6947}.pill.fail{background:#f5e5e2;color:var(--danger)}.empty{color:var(--muted);font-size:13px;text-align:center;padding:18px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;display:none}.toast.show{display:block;animation:toast 3s forwards}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}@keyframes toast{0%,75%{opacity:1}100%{opacity:0}}@media(max-width:520px){.app{padding:20px 15px 35px}.header{margin-bottom:29px}.intro h1{font-size:30px}.panel{padding:12px;border-radius:17px}.drop{min-height:205px}.controls{display:block}.counter{margin-bottom:14px}.send{width:100%;height:50px}.setting{gap:10px}.setting input,.setting select{max-width:160px}}
</style></head>
<body><main class="app"><header class="header"><div class="logo">Print<em>Flow</em></div><div class="connection"><i class="led" id="led"></i><span id="connectionText">Comprobando impresora</span></div></header><section class="intro"><small>Centro de impresión</small><h1>Enviar un PDF</h1><p>Seleccioná un archivo listo para imprimir.</p></section><section class="panel"><label class="drop" for="pdf"><div class="icon">↥</div><strong>Elegir archivo PDF</strong><span>Desde Archivos o iCloud · máximo 25 MB</span><input id="pdf" type="file" accept="application/pdf"></label><div class="selected" id="selected"><div class="doc">▧</div><div class="meta" id="filename"></div><button class="remove" id="remove">×</button></div><div class="controls"><div><span class="label">Copias</span><div class="counter"><button id="minus">−</button><input id="copies" type="number" value="1" min="1" max="99"><button id="plus">＋</button></div></div><button class="send" id="send" disabled>Enviar a imprimir</button></div><div class="progress" id="progress"><div class="track"><i></i></div></div><div class="result" id="result"><span class="check">✓</span><span id="resultText"></span></div></section><details class="secondary"><summary>Configuración de impresora</summary><div class="settings"><label class="setting">Nombre en Windows<input id="printerName"></label><label class="setting">Papel<select id="paper"><option>A4</option><option>A5</option><option>Letter</option></select></label><label class="setting">Modo<select id="color"><option value="COLOR">Color</option><option value="GRAYSCALE">Escala de grises</option></select></label><label class="setting">Calidad<select id="quality"><option value="DRAFT">Borrador</option><option value="NORMAL">Normal</option><option value="HIGH">Alta</option></select></label><button class="save" id="saveConfig">Guardar configuración</button></div></details><section class="recent"><div class="recent-head"><h2>Trabajos recientes</h2><small>Actualización automática</small></div><div class="jobs" id="jobs"><div class="empty">Todavía no hay trabajos.</div></div></section></main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),pdf=$('#pdf'),selected=$('#selected'),send=$('#send'),copies=$('#copies'),jobs=$('#jobs'),progress=$('#progress'),result=$('#result'),resultText=$('#resultText'),toast=$('#toast');let currentFile;
pdf.onchange=()=>{currentFile=pdf.files[0];if(!currentFile)return;if(currentFile.type!=='application/pdf'){alert('Solo se aceptan archivos PDF.');pdf.value='';return}$('#filename').innerHTML='<b>'+currentFile.name+'</b><small>'+Math.ceil(currentFile.size/1024)+' KB · PDF listo</small>';$('.drop').style.display='none';selected.classList.add('show');send.disabled=false};$('#remove').onclick=()=>{pdf.value='';currentFile=null;selected.classList.remove('show');$('.drop').style.display='flex';send.disabled=true};$('#minus').onclick=()=>copies.value=Math.max(1,+copies.value-1);$('#plus').onclick=()=>copies.value=Math.min(99,+copies.value+1);
send.onclick=async()=>{const form=new FormData();form.append('pdf',currentFile);form.append('copies',copies.value);send.disabled=true;progress.classList.add('show');result.className='result';try{const r=await fetch('/api/jobs',{method:'POST',body:form}),j=await r.json();if(!r.ok)throw Error(j.error);progress.classList.remove('show');result.className='result show ok';resultText.textContent=j.id+' agregado a la cola';toast.textContent='Trabajo enviado';toast.classList.add('show');refresh();setTimeout(()=>toast.classList.remove('show'),3000);pdf.value='';currentFile=null;selected.classList.remove('show');$('.drop').style.display='flex'}catch(e){progress.classList.remove('show');result.className='result show error';result.querySelector('.check').textContent='!';resultText.textContent=e.message;send.disabled=false}};
function label(s){return{PENDING:'En cola',PRINTING:'Imprimiendo',COMPLETED:'Completado',FAILED:'Fallido',CANCELLED:'Cancelado'}[s]||s}function addJob(j){const el=document.createElement('div');el.className='job';el.innerHTML='<div class="job-icon">▧</div><div class="job-main"><b>'+j.filename+'</b><small>'+j.id+' · '+j.copies+' '+(j.copies==1?'copia':'copias')+'</small></div><span class="pill '+(j.status==='COMPLETED'?'done':j.status==='FAILED'?'fail':'')+'">'+label(j.status)+'</span>';jobs.appendChild(el)}async function refresh(){const r=await fetch('/api/jobs');if(!r.ok)return;const data=await r.json();jobs.innerHTML='';if(!data.length)jobs.innerHTML='<div class="empty">Todavía no hay trabajos.</div>';data.slice(0,8).forEach(addJob)}async function check(){const r=await fetch('/api/health');const ok=r.ok&&(await r.json()).agentConnected;$('#led').className='led '+(ok?'on':'');$('#connectionText').textContent=ok?'Impresora lista':'Agente desconectado'}async function config(){const r=await fetch('/api/settings/printer');if(!r.ok)return;const s=await r.json();$('#printerName').value=s.name;$('#paper').value=s.paper;$('#color').value=s.color_mode;$('#quality').value=s.quality}$('#saveConfig').onclick=async()=>{await fetch('/api/settings/printer',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({name:$('#printerName').value,paper:$('#paper').value,color_mode:$('#color').value,quality:$('#quality').value})});toast.textContent='Configuración guardada';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2500)};config();refresh();check();setInterval(refresh,5000);setInterval(check,5000);
</script></body></html>
